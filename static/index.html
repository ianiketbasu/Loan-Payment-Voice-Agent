<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Reminder Voice Agent - POC</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <!-- <h1>Loan Reminder Voice Agent</h1> -->
            <p class="subtitle">Automated Voice Reminders with AI-Powered Response Capture</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="totalCustomers">0</div>
                <div class="stat-label">Total Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedCalls">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="yesResponses">0</div>
                <div class="stat-label">Said YES</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="noResponses">0</div>
                <div class="stat-label">Said NO</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="refreshCustomers()">
                Refresh List
            </button>
            <button class="btn btn-success" onclick="sendBatchReminders()" id="batchReminderBtn">
                Send Reminders to All
            </button>
            <button class="btn btn-secondary" onclick="testConnection()">
                Test Connection
            </button>
        </div>

        <div class="table-container">
            <table id="customersTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Phone Number</th>
                        <th>Loan Amount</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Wants to Pay Early</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="customersTableBody">
                    <!-- Customers will be loaded here -->
                </tbody>
            </table>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
